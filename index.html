<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Questa riga serve per far vedere bene l'app sui telefoni -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Check-in</title>
    
    <!-- Carichiamo le "menti" dell'app: Tesseract per leggere e SignaturePad per la firma -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

    <style>
        /* CSS per rendere l'app moderna e pulita */
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #1a73e8; text-align: center; }
        .hidden { display: none; }
        input[type="file"] { margin: 20px 0; width: 100%; }
        #canvas-firma { border: 2px dashed #ccc; border-radius: 10px; background: #fafafa; width: 100%; height: 200px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .status { font-style: italic; color: #555; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Smart Check-in</h1>
    
    <!-- SEZIONE 1: SCANSIONE -->
    <div id="step-scansione">
        <p>1. Scatta una foto nitida al documento:</p>
        <input type="file" id="foto-doc" accept="image/*" capture="camera">
        <div id="stato-ocr" class="status"></div>
    </div>

    <!-- SEZIONE 2: DATI ESTRATTI -->
    <div id="step-dati" class="hidden">
        <h3>Controlla i Dati</h3>
        <label>Nome e Cognome:</label>
        <input type="text" id="campo-nome" style="width:100%; margin-bottom:10px;">
        <label>Documento n.:</label>
        <input type="text" id="campo-doc" style="width:100%; margin-bottom:10px;">
        <button onclick="vaiAllaFirma()">Dati Corretti, vai alla Firma</button>
    </div>

    <!-- SEZIONE 3: PRIVACY E FIRMA -->
    <div id="step-firma" class="hidden">
        <h3>Informativa Privacy</h3>
        <p style="font-size: 12px; color: #666;">Autorizzo il trattamento dei dati per la comunicazione alloggiati e imposta di soggiorno (Pegaso).</p>
        <canvas id="canvas-firma"></canvas>
        <button onclick="pulisciFirma()" style="background:#dc3545;">Cancella Firma</button>
        <button onclick="salvaTutto()" style="background:#28a745; margin-top:20px;">Finalizza Check-in</button>
    </div>
</div>

<script>
    // Inizializziamo gli elementi
    const inputFoto = document.getElementById('foto-doc');
    const statoOcr = document.getElementById('stato-ocr');
    const canvas = document.getElementById('canvas-firma');
    const signaturePad = new SignaturePad(canvas); // Attiva la firma col dito

    // Funzione che scatta quando selezioni la foto
    inputFoto.onchange = async function() {
    const file = inputFoto.files[0];
    if (!file) return;

    statoOcr.innerText = "⚙️ Ottimizzazione immagine e scansione MRZ...";

    // Creiamo un'area di disegno (Canvas) nascosta per elaborare l'immagine
    const canvasElaborazione = document.createElement('canvas');
    const ctx = canvasElaborazione.getContext('2d');
    const img = new Image();

    img.onload = async function() {
        // Impostiamo le dimensioni del canvas come l'immagine originale
        canvasElaborazione.width = img.width;
        canvasElaborazione.height = img.height;

        // Applichiamo un filtro per aumentare contrasto e nitidezza
        ctx.filter = 'contrast(1.4) brightness(0.9) grayscale(1)';
        ctx.drawImage(img, 0, 0);

        // Avviamo Tesseract con una "Whitelist" specifica per MRZ
        const risultato = await Tesseract.recognize(canvasElaborazione, 'ita', {
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<', // Forza a leggere solo questi
            logger: m => console.log(m.status + ": " + m.progress)
        });

        const testoGrezzo = risultato.data.text;
        analizzaTestoAvanzato(testoGrezzo);
    };
    img.src = URL.createObjectURL(file);
};
function elaboraTestoDocumento(testo) {
    // Pulizia iniziale: rimuoviamo spazi extra e rendiamo tutto maiuscolo
    const righe = testo.toUpperCase().split('\n').map(r => r.trim());
    let risultato = { nomeCognome: "Non trovato", numeroDoc: "Non trovato", nazionalita: "---" };

    // --- LOGICA LIVELLO 1: RICERCA MRZ (Standard Internazionale) ---
    // Cerchiamo righe che contengono molti caratteri '<<<'
    const rigaMRZ = righe.find(r => r.includes("<<"));

    if (rigaMRZ) {
        console.log("MRZ rilevato! Estrazione internazionale...");
        // Esempio MRZ: I<ITADROSSI<<MARIO<<<<<<<<<<<
        // Puliamo la riga dai simboli < per estrarre i nomi
        const parti = rigaMRZ.split('<<');
        const cognome = parti[0].replace(/[I<A-Z]{3}/, ""); // Rimuove codice nazione iniziale
        const nome = parti[1] ? parti[1].replace(/<+/g, " ") : "";
        
        risultato.nomeCognome = `${cognome} ${nome}`.trim();
        risultato.nazionalita = rigaMRZ.substring(2, 5); // Le tre lettere della nazione (es: ITA, FRA, USA)
    } 
    
    // --- LOGICA LIVELLO 2: KEYWORDS MULTILINGUA (Se MRZ fallisce) ---
    else {
        const keywordsCognome = ["COGNOME", "SURNAME", "NOM", "APELLIDO", "NAME"];
        
        for (let i = 0; i < righe.length; i++) {
            // Se troviamo una qualsiasi parola chiave internazionale
            if (keywordsCognome.some(key => righe[i].includes(key))) {
                if (righe[i+1]) {
                    risultato.nomeCognome = righe[i+1].replace(/[^A-Z ]/g, ""); // Solo lettere
                    break;
                }
            }
        }
    }

    // --- RICERCA NUMERO DOCUMENTO INTERNAZIONALE ---
    // Cerca pattern comuni: 9 caratteri alfanumerici (comune in molti passaporti)
    const regexDocUniversale = /[A-Z0-9]{8,10}/;
    const matchDoc = testo.match(regexDocUniversale);
    if (matchDoc) risultato.numeroDoc = matchDoc[0];

    return risultato;
}
    function vaiAllaFirma() {
        document.getElementById('step-dati').classList.add('hidden');
        document.getElementById('step-firma').classList.remove('hidden');
        // Adatta il canvas alla larghezza della card
        canvas.width = canvas.offsetWidth;
        canvas.height = 200;
    }

    function pulisciFirma() {
        signaturePad.clear();
    }

    function salvaTutto() {
        if (signaturePad.isEmpty()) {
            alert("Per favore, fai firmare il cliente!");
        } else {
            alert("Check-in completato! Dati pronti per Pegaso.");
            // Qui inseriremo la logica per creare il file per Pegaso
        }
    }
</script>

</body>
</html>
